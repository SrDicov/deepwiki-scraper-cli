# Compila y testea el CLI en GitHub (el repo ya no necesita toolchain local).
name: build
on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar V
        run: |
          curl -sL -o /tmp/v.zip https://github.com/vlang/v/releases/latest/download/v_linux.zip
          unzip -q /tmp/v.zip -d /tmp
          echo "/tmp/v" >> "$GITHUB_PATH"
          /tmp/v/v version
      - name: Tests
        run: cd v && v test .
      - name: Build glibc
        run: cd v && v -prod -o deepwiki .
      - name: Build musl estático (Chimera)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cd v && v -cc musl-gcc -cflags "-static" -gc none -d musl -prod -o deepwiki-chimera .
      - name: Humo
        run: |
          ./v/deepwiki --version
          ./v/deepwiki-chimera --version
          printf '# T\n' | ./v/deepwiki -
          printf '' | ./v/deepwiki - 2>&1 | grep -q 'no se recibió' && echo STDIN-VACIO-OK
      - uses: actions/upload-artifact@v4
        with:
          name: deepwiki-linux-x86_64
          path: |
            v/deepwiki
            v/deepwiki-chimera
