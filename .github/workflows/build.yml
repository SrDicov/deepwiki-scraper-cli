# Compila y testea el CLI en GitHub (el repo ya no necesita toolchain local).
name: build
on:
  push:
    branches: [main, testing]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar V
        run: |
          curl -sL -o /tmp/v.zip https://github.com/vlang/v/releases/latest/download/v_linux.zip
          unzip -q /tmp/v.zip -d /tmp
          echo "/tmp/v" >> "$GITHUB_PATH"
          /tmp/v/v version
      - name: Tests
        run: v test .
      - name: Build glibc
        run: v -prod -o deepwiki .
      - name: Build musl estático (Chimera)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          v -cc musl-gcc -cflags "-static" -gc none -d musl -prod -o deepwiki-chimera .
      - name: Humo
        run: |
          ./deepwiki --version
          ./deepwiki-chimera --version
          printf '# T\n' | ./deepwiki -
          printf '' | ./deepwiki - 2>&1 | grep -q 'no se recibió' && echo STDIN-VACIO-OK
      - uses: actions/upload-artifact@v4
        with:
          name: deepwiki-linux-x86_64
          path: |
            deepwiki
            deepwiki-chimera
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: deepwiki-linux-x86_64
          path: dist/
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes dist/deepwiki dist/deepwiki-chimera
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
